[workspace]
resolver = "2"
members = ["examples", "mania", "mania-codec", "mania-core", "mania-macros"]

[workspace.package]
version = "0.0.2"
edition = "2024"
license-file = "LICENCE"
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0.104"
arc-swap = { version = "1.9.3", features = ["serde"] }
byteorder = "1.5.0"
bytes = { version = "1.12.1", features = ["serde"] }
cfg-if = "1.0.5"
chrono = { version = "0.4.45", features = ["serde"] }
console-subscriber = "0.5.0"
dashmap = "6.2.1"
digest = "0.11.3"
elliptic-curve = "0.14.3"
flate2 = "1.1.10"
futures = "0.3.34"
generic-array = "1.4.5"
glob = "0.3.4"
hex = "0.4.3"
image = "0.25.10"
inventory = "0.3.25"
mania = { path = "mania" }
mania-codec = { path = "mania-codec" }
mania-core = { path = "mania-core" }
mania-macros = { path = "mania-macros" }
md-5 = "0.11.0"
noise = "0.9.0"
num-traits = "0.2.19"
num_enum = "0.7.6"
once_cell = "1.21.4"
p256 = { version = "0.14.0", features = ["ecdh"] }
phf = { version = "0.14.0", features = ["macros"] }
proc-macro2 = "1.0.107"
prost = "0.14.4"
prost-build = "0.14.4"
quick-xml = { version = "0.42.0", features = ["serialize"] }
quote = "1.0.47"
rand = "0.10.3"
rand_chacha = "0.10.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["query", "form"] }
rubato = "0.16.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
silk-sys = "0.1.0"
surge-ping = "0.9.1"
symphonia = { git = "https://github.com/pdeljanov/Symphonia.git", rev = "c7efbcb0", features = ["all"] }
syn = { version = "3.0.9", features = ["full"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "net", "io-util", "time", "macros", "rt-multi-thread", "signal", "tracing", "sync"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["serde", "v4"] }

[profile.release]
lto = true
incremental = false
codegen-units = 1
strip = true
